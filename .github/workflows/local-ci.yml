name: Local CI

on:
  workflow_dispatch:

jobs:
  local-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run local CI script
        shell: pwsh
        run: ./scripts/ci-local.ps1
